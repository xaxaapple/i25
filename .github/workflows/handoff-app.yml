name: handoff launcher app
on:
  push:
    paths:
      - 'oneios-handoff-launcher/**'
      - '.github/workflows/handoff-app.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: oneios-handoff-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the Gradle wrapper jar
        # Not committed (this environment has no network path to services.gradle.org to fetch it
        # by hand); the pinned version lives in gradle/wrapper/gradle-wrapper.properties and this
        # step only materialises gradle-wrapper.jar from it, using the setup-gradle action's own
        # Gradle install so the version that generates the wrapper is not left to the runner's
        # default.
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle wrapper && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: oneios-handoff-launcher-debug-apk
          path: oneios-handoff-launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
